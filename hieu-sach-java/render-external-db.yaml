# Blueprint cho dich vu web voi MySQL 8.4 ben ngoai.
services:
  - type: web
    name: hieu-sach-tri-thuc
    runtime: docker
    plan: free
    region: singapore
    rootDir: hieu-sach-java
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: BOOKSTORE_PUBLIC
        value: "true"
      - key: BOOKSTORE_DB_URL
        sync: false
      - key: BOOKSTORE_DB_USER
        sync: false
      - key: BOOKSTORE_DB_PASSWORD
        sync: false
