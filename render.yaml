# Deploy tu repo goc chua thu muc hieu-sach-java.
# Dich vu web ket noi toi mot MySQL 8.4 ben ngoai.
services:
  - type: web
    name: hieu-sach-tri-thuc
    runtime: docker
    plan: free
    region: singapore
    rootDir: hieu-sach-java
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: BOOKSTORE_PUBLIC
        value: "true"
      - key: BOOKSTORE_BIND
        value: 0.0.0.0
      - key: BOOKSTORE_DB_URL
        sync: false
      - key: BOOKSTORE_DB_USER
        sync: false
      - key: BOOKSTORE_DB_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: hieu-sach-db
          property: connectionString
databases:
  - name: hieu-sach-db
    plan: free
    region: singapore
    postgresMajorVersion: "16"
    databaseName: hieusach
    user: hieusach
    ipAllowList: []
